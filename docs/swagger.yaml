  /characters:
    get:
      description: Returns a map of character IDs to character names
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all characters
      tags:
      - quotes
  /config:
    get:
      description: Returns service configuration flags
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get configuration
      tags:
      - system
  /context/{audioId}:
    get:
      description: Returns surrounding dialogue lines for a specific quote
      parameters:
      - description: Audio ID of the quote
        in: path
        name: audioId
        required: true
        type: string
      - default: en
        description: Language
        enum:
        - en
        - wh
        - ja
        - ru
        - es
        - pt
        in: query
        name: lang
        type: string
      - default: 5
        description: Number of context lines before and after
        in: query
        name: lines
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ContextResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get quote context
      tags:
      - quotes
  /health:
    get:
      description: Returns the health status of the service including language loading
        status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - system
  /nearest-voiced/{audioId}:
    get:
      description: Returns the audio ID of the nearest quote with voice audio in a
        given direction
      parameters:
      - description: Audio ID of the reference quote
        in: path
        name: audioId
        required: true
        type: string
      - default: en
        description: Language
        enum:
        - en
        - wh
        - ja
        - ru
        - es
        - pt
        in: query
        name: lang
        type: string
      - default: next
        description: Direction to search
        enum:
        - next
        - prev
        in: query
        name: direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Find nearest voiced quote
      tags:
      - quotes
  /quote/{audioId}:
    get:
      description: Returns a specific quote identified by its audio ID
      parameters:
      - description: Audio ID of the quote
        in: path
        name: audioId
        required: true
        type: string
      - default: en
        description: Language
        enum:
        - en
        - wh
        - ja
        - ru
        - es
        - pt
        in: query
        name: lang
        type: string
      produces:
