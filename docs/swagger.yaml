basePath: /api/v1
definitions:
  dto.CharacterPresence:
    properties:
      characterId:
        description: Numeric character identifier
        example: "10"
        type: string
      episodes:
        description: List of episode numbers the character appears in
        items:
          type: integer
        type: array
      name:
        description: Display name of the character
        example: Ushiromiya Battler
        type: string
    type: object
  dto.CharacterResponse:
    properties:
      character:
        description: Display name of the character
        example: Ushiromiya Battler
        type: string
      characterId:
        description: Numeric character identifier
        example: "10"
        type: string
      limit:
        description: Maximum results per page
        example: 50
        type: integer
      offset:
        description: Pagination offset
        example: 0
        type: integer
      quotes:
        description: Paginated list of quotes
        items:
          type: object
        type: array
      total:
        description: Total number of matching quotes
        example: 4304
        type: integer
    type: object
  dto.CharactersResult:
    properties:
      additional:
        additionalProperties:
          type: string
        type: object
      characters:
        additionalProperties:
          type: string
        type: object
    type: object
  dto.CiconiaQuote:
    properties:
      audioCharMap:
        additionalProperties:
          type: string
        example:
          "30101088": "10"
          "30101089": "10"
        type: object
      audioId:
        example: 30101088, 30101089
        type: string
      audioTextMap:
        additionalProperties:
          type: string
        example:
          "30101088": You're insane!!
          "30101089": Stop it already
        type: object
      chapter:
        example: "01"
        type: string
      character:
        example: Ushiromiya Battler
        type: string
      characterId:
        example: "10"
        type: string
      contentType:
        example: ""
        type: string
      episode:
        example: 3
        type: integer
      index:
        description: Position index in the parsed script (stable across text changes)
        type: integer
      soundEffects:
        items:
          $ref: '#/definitions/dto.SoundEffect'
        type: array
      text:
        example: You're insane!! Stop it already, damn iiiiiiiiit!!
        type: string
      textHtml:
        example: You&#39;re insane!! Stop it already, damn iiiiiiiiit!!
        type: string
      textJp:
        type: string
      textJpHtml:
        type: string
    type: object
  dto.CiconiaStatsResult:
    properties:
      characterNames:
        additionalProperties:
          type: string
        description: Map of character ID to display name
        type: object
      interactionCounts:
        additionalProperties:
          type: integer
        description: Map of character pair key to interaction count
        type: object
      interactions:
        description: Top character interaction pairs
        items:
          $ref: '#/definitions/dto.InteractionPair'
        type: array
      linesPerChapter:
        additionalProperties:
          additionalProperties:
            type: integer
          type: object
        description: Dialogue line counts per chapter per character
        type: object
      topSpeakers:
        description: Top speakers by dialogue line count
        items:
          $ref: '#/definitions/dto.SpeakerStat'
        type: array
    type: object
  dto.ContextResponse:
    properties:
      after:
        description: Dialogue lines after the target quote
        items:
          type: object
        type: array
      before:
        description: Dialogue lines before the target quote
        items:
          type: object
        type: array
      quote:
        description: The target quote
        type: object
    type: object
  dto.EpisodeCharacterLines:
    properties:
      characters:
        additionalProperties:
          type: integer
        description: Map of character ID to line count
        type: object
      episode:
        description: Episode number (1-8)
        example: 1
        type: integer
      episodeName:
        description: Episode title
        example: Legend
        type: string
    type: object
  dto.EpisodeTruth:
    properties:
      blue:
        description: Number of blue truth statements
        example: 0
        type: integer
      episode:
        description: Episode number (1-8)
        example: 2
        type: integer
      gold:
        description: Number of gold truth statements
        example: 0
        type: integer
      purple:
        description: Number of purple truth statements
        example: 0
        type: integer
      red:
        description: Number of red truth statements
        example: 38
        type: integer
    type: object
  dto.ErrorResponse:
    properties:
      error:
        description: Error message
        example: query parameter 'q' is required
        type: string
    type: object
  dto.HigurashiStatsResult:
    properties:
      characterNames:
        additionalProperties:
          type: string
        description: Map of character ID to display name
        type: object
      interactionCounts:
        additionalProperties:
          type: integer
        description: Map of character pair key to interaction count
        type: object
      interactions:
        description: Top character interaction pairs
        items:
          $ref: '#/definitions/dto.InteractionPair'
        type: array
      linesPerArc:
        additionalProperties:
          additionalProperties:
            type: integer
          type: object
        description: Dialogue line counts per arc per character
        type: object
      topSpeakers:
        description: Top speakers by dialogue line count
        items:
          $ref: '#/definitions/dto.SpeakerStat'
        type: array
    type: object
  dto.InteractionPair:
    properties:
      charA:
        description: First character ID
        example: "10"
        type: string
      charB:
        description: Second character ID
        example: "27"
        type: string
      count:
        description: Number of shared dialogue exchanges
        example: 1701
        type: integer
      nameA:
        description: First character name
        example: Ushiromiya Battler
        type: string
      nameB:
        description: Second character name
        example: Beatrice
        type: string
    type: object
  dto.SearchAPIResponse:
    properties:
      limit:
        description: Maximum results per page
        example: 30
        type: integer
      offset:
        description: Pagination offset
        example: 0
        type: integer
      query:
        description: The search query that was used
        example: without love
        type: string
      results:
        description: Matching quotes with relevance scores
        items:
          $ref: '#/definitions/dto.SearchResult'
        type: array
      total:
        description: Total number of matches
        example: 25
        type: integer
    type: object
  dto.SearchResult:
    properties:
      quote:
        description: The matched quote
        type: object
      score:
        description: Relevance score (100 = exact match)
        example: 100
        type: integer
    type: object
  dto.SoundEffect:
    properties:
      afterClip:
        example: 0
        type: integer
      filename:
        example: umise_047
        type: string
    type: object
  dto.SpeakerStat:
    properties:
      characterId:
        description: Numeric character identifier
        example: "10"
        type: string
      count:
        description: Number of dialogue lines
        example: 4304
        type: integer
      name:
        description: Display name of the character
        example: Ushiromiya Battler
        type: string
    type: object
  dto.StatsResult:
    properties:
      characterNames:
        additionalProperties:
          type: string
        description: Map of character ID to display name
        example:
          "10": Ushiromiya Battler
          "27": Beatrice
        type: object
      characterPresence:
        description: Characters and which episodes they appear in
        items:
          $ref: '#/definitions/dto.CharacterPresence'
        type: array
      episodeNames:
        additionalProperties:
          type: string
        description: Map of episode number to episode title
        type: object
      interactionCounts:
        additionalProperties:
          type: integer
        description: Map of character pair key to interaction count
        type: object
      interactions:
        description: Top character interaction pairs
        items:
          $ref: '#/definitions/dto.InteractionPair'
        type: array
      linesPerEpisode:
        description: Dialogue line counts per episode per character
        items:
          $ref: '#/definitions/dto.EpisodeCharacterLines'
        type: array
      topSpeakers:
        description: Top speakers by dialogue line count
        items:
          $ref: '#/definitions/dto.SpeakerStat'
        type: array
      truthPerEpisode:
        description: Truth statement counts per episode
        items:
          $ref: '#/definitions/dto.EpisodeTruth'
        type: array
    type: object
  umineko_quote_internal_dto.HigurashiQuote:
    properties:
      arc:
        example: onikakushi
        type: string
      audioCharMap:
        additionalProperties:
          type: string
        example:
          "30101088": "10"
          "30101089": "10"
        type: object
      audioId:
        example: 30101088, 30101089
        type: string
      audioTextMap:
        additionalProperties:
          type: string
        example:
          "30101088": You're insane!!
          "30101089": Stop it already
        type: object
      character:
        example: Ushiromiya Battler
        type: string
      characterId:
        example: "10"
        type: string
      contentType:
        example: ""
        type: string
      episode:
        example: 3
        type: integer
      index:
        description: Position index in the parsed script (stable across text changes)
        type: integer
      soundEffects:
        items:
          $ref: '#/definitions/dto.SoundEffect'
        type: array
      text:
        example: You're insane!! Stop it already, damn iiiiiiiiit!!
        type: string
      textHtml:
        example: You&#39;re insane!! Stop it already, damn iiiiiiiiit!!
        type: string
      textJp:
        type: string
      textJpHtml:
        type: string
    type: object
  umineko_quote_internal_dto.UminekoQuote:
    properties:
      audioCharMap:
        additionalProperties:
          type: string
        example:
          "30101088": "10"
          "30101089": "10"
        type: object
      audioId:
        example: 30101088, 30101089
        type: string
      audioTextMap:
        additionalProperties:
          type: string
        example:
          "30101088": You're insane!!
          "30101089": Stop it already
        type: object
      character:
        example: Ushiromiya Battler
        type: string
      characterId:
        example: "10"
        type: string
      contentType:
        example: ""
        type: string
      episode:
        example: 3
        type: integer
      hasBlueTruth:
        example: false
        type: boolean
      hasGoldTruth:
        example: false
        type: boolean
      hasPurpleTruth:
        example: false
        type: boolean
      hasRedTruth:
        example: false
        type: boolean
      index:
        description: Position index in the parsed script (stable across text changes)
        type: integer
      soundEffects:
        items:
          $ref: '#/definitions/dto.SoundEffect'
        type: array
      text:
        example: You're insane!! Stop it already, damn iiiiiiiiit!!
        type: string
      textHtml:
        example: You&#39;re insane!! Stop it already, damn iiiiiiiiit!!
        type: string
    type: object
info:
  contact:
    email: FAA@auaurora.moe
    name: Featherine Augustus Aurora
    url: https://x.com/FeatherineFAA
  description: API for searching and browsing quotes from Umineko no Naku Koro ni,
    Higurashi no Naku Koro ni, and Ciconia no Naku Koro ni
  title: When They Cry Quote API
  version: "1.0"
paths:
  /ciconia/browse:
    get:
      description: Browse all Ciconia quotes with optional filters and pagination
      parameters:
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      - description: Filter by character ID
        in: query
        name: character
        type: string
      - description: 'Interaction filter: first character ID (requires interactionB)'
        in: query
        name: interactionA
        type: string
      - description: 'Interaction filter: second character ID (requires interactionA)'
        in: query
        name: interactionB
        type: string
      - default: 50
        description: Maximum results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Filter by chapter ID
        in: query
        name: chapter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CharacterResponse'
      summary: Browse Ciconia quotes
      tags:
      - ciconia
  /ciconia/characters:
    get:
      description: Returns main cast (curated roster of named speakers) and additional
        (ensemble roles and other script markers) character maps
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CharactersResult'
      summary: List all Ciconia characters
      tags:
      - ciconia
  /ciconia/context/{audioId}:
    get:
      description: Returns surrounding dialogue lines for a specific Ciconia quote
      parameters:
      - description: Synthetic audio ID
        in: path
        name: audioId
        required: true
        type: string
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      - default: 5
        description: Number of context lines before and after
        in: query
        name: lines
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ContextResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Ciconia quote context
      tags:
      - ciconia
  /ciconia/og/quote.png:
    get:
      description: Renders a social-preview PNG for a Ciconia quote identified by
        its synthetic audio ID (e.g. c11:6d333931)
      parameters:
      - description: Synthetic audio ID
        in: query
        name: audioId
        required: true
        type: string
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      - description: Render the full-length layout instead of the compact preview
        in: query
        name: full
        type: boolean
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Ciconia OG preview image
      tags:
      - ciconia
  /ciconia/quote/{audioId}:
    get:
      description: Returns a specific Ciconia quote identified by its synthetic audio
        ID (e.g. c01:a3f2b81c, pro:xxxxxxxx, df03:xxxxxxxx)
      parameters:
      - description: Synthetic audio ID (may contain colons)
        in: path
        name: audioId
        required: true
        type: string
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CiconiaQuote'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Ciconia quote by synthetic ID
      tags:
      - ciconia
  /ciconia/quote/index/{index}:
    get:
      description: Returns a specific Ciconia quote identified by its position index
        in the parsed script
      parameters:
      - description: Index of the quote in the parsed script
        in: path
        name: index
        required: true
        type: integer
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CiconiaQuote'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Ciconia quote by index
      tags:
      - ciconia
  /ciconia/random:
    get:
      description: Returns a random Ciconia quote with optional filters
      parameters:
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      - description: Filter by character ID
        in: query
        name: character
        type: string
      - description: Filter by chapter ID
        in: query
        name: chapter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CiconiaQuote'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get random Ciconia quote
      tags:
      - ciconia
  /ciconia/search:
    get:
      description: Search for Ciconia no Naku Koro ni Phase 1 quotes by text query
        with optional filters
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      - default: 30
        description: Maximum results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Filter by character ID (e.g. miyao, jayden, keropoyo)
        in: query
        name: character
        type: string
      - description: 'Interaction filter: first character ID (requires interactionB)'
        in: query
        name: interactionA
        type: string
      - description: 'Interaction filter: second character ID (requires interactionA)'
        in: query
        name: interactionB
        type: string
      - description: Filter by chapter ID (00 for prologue, 01-25 for main acts, 25b
          for finale, df01-df16 for data fragments)
        in: query
        name: chapter
        type: string
      - default: false
        description: Match whole words only
        in: query
        name: exact
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SearchAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Search Ciconia quotes
      tags:
      - ciconia
  /ciconia/stats:
    get:
      description: Returns statistics about Ciconia quotes including top speakers,
        lines per chapter, and character interactions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CiconiaStatsResult'
      summary: Get Ciconia quote statistics
      tags:
      - ciconia
  /higurashi/browse:
    get:
      description: Browse all Higurashi quotes with optional filters and pagination
      parameters:
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      - description: Filter by character ID
        enum:
        - narrator
        - misc_voices
        - keiichi
        - rena
        - mion
        - satoko
        - rika
        - shion
        - satoshi
        - tomitake
        - takano
        - irie
        - ooishi
        - hanyuu
        - akasaka
        - okonogi
        - kasai
        - kimiyoshi
        - oryou
        - teppei
        - rina
        - chie
        - tomoe
        - madoka
        - yamaoki
        - fujita
        - natsumi
        - chisato
        - tamako
        - akira
        - miyuki
        - otobe
        - towada
        - riku
        - ouka
        - kumagai
        - nagisa
        - akane
        - arakawa
        - maeno
        in: query
        name: character
        type: string
      - description: 'Interaction filter: first character ID (requires interactionB)'
        enum:
        - narrator
        - misc_voices
        - keiichi
        - rena
        - mion
        - satoko
        - rika
        - shion
        - satoshi
        - tomitake
        - takano
        - irie
        - ooishi
        - hanyuu
        - akasaka
        - okonogi
        - kasai
        - kimiyoshi
        - oryou
        - teppei
        - rina
        - chie
        - tomoe
        - madoka
        - yamaoki
        - fujita
        - natsumi
        - chisato
        - tamako
        - akira
        - miyuki
        - otobe
        - towada
        - riku
        - ouka
        - kumagai
        - nagisa
        - akane
        - arakawa
        - maeno
        in: query
        name: interactionA
        type: string
      - description: 'Interaction filter: second character ID (requires interactionA)'
        enum:
        - narrator
        - misc_voices
        - keiichi
        - rena
        - mion
        - satoko
        - rika
        - shion
        - satoshi
        - tomitake
        - takano
        - irie
        - ooishi
        - hanyuu
        - akasaka
        - okonogi
        - kasai
        - kimiyoshi
        - oryou
        - teppei
        - rina
        - chie
        - tomoe
        - madoka
        - yamaoki
        - fujita
        - natsumi
        - chisato
        - tamako
        - akira
        - miyuki
        - otobe
        - towada
        - riku
        - ouka
        - kumagai
        - nagisa
        - akane
        - arakawa
        - maeno
        in: query
        name: interactionB
        type: string
      - default: 50
        description: Maximum results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Filter by arc number
        in: query
        name: episode
        type: integer
      - description: Filter by arc name (e.g. onikakushi, watanagashi)
        in: query
        name: arc
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CharacterResponse'
      summary: Browse quotes
      tags:
      - higurashi
  /higurashi/characters:
    get:
      description: Returns a map of Higurashi character IDs to character names
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all characters
      tags:
      - higurashi
  /higurashi/context/{audioId}:
    get:
      description: Returns surrounding dialogue lines for a specific Higurashi quote
      parameters:
      - description: Audio ID of the quote (e.g. ps3/s01/01/hrs010010)
        in: path
        name: audioId
        required: true
        type: string
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      - default: 5
        description: Number of context lines before and after
        in: query
        name: lines
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ContextResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get quote context
      tags:
      - higurashi
  /higurashi/nearest-voiced/{audioId}:
    get:
      description: Returns the audio ID of the nearest Higurashi quote with voice
        audio in a given direction
      parameters:
      - description: Audio ID of the reference quote (e.g. ps3/s01/01/hrs010010)
        in: path
        name: audioId
        required: true
        type: string
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      - default: next
        description: Direction to search
        enum:
        - next
        - prev
        in: query
        name: direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Find nearest voiced quote
      tags:
      - higurashi
  /higurashi/quote/{audioId}:
    get:
      description: Returns a specific Higurashi quote identified by its audio ID (may
        contain slashes)
      parameters:
      - description: Audio ID of the quote (e.g. ps3/s01/01/hrs010010)
        in: path
        name: audioId
        required: true
        type: string
      - default: en
        description: Language
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/umineko_quote_internal_dto.HigurashiQuote'
        "404":
