          description: OK
          schema:
            $ref: '#/definitions/umineko_quote_internal_dto.ParsedQuote'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get quote by audio ID
      tags:
      - quotes
