basePath: /api/v1
definitions:
  dto.CharacterPresence:
    properties:
      characterId:
        description: Numeric character identifier
        example: "10"
        type: string
      episodes:
        description: Line counts per episode (index 0 = ep 1)
        items:
          type: integer
        type: array
      name:
        description: Display name of the character
        example: Ushiromiya Battler
        type: string
    type: object
  dto.CharacterResponse:
    properties:
      character:
        description: Display name of the character
        example: Ushiromiya Battler
        type: string
      characterId:
        description: Numeric character identifier
        example: "10"
        type: string
      limit:
        description: Maximum results per page
        example: 50
        type: integer
      offset:
        description: Pagination offset
        example: 0
        type: integer
      quotes:
        description: Paginated list of quotes
        items:
          $ref: '#/definitions/umineko_quote_internal_dto.ParsedQuote'
        type: array
      total:
        description: Total number of matching quotes
        example: 4304
        type: integer
    type: object
  dto.ContextResponse:
    properties:
      after:
        description: Dialogue lines after the target quote
        items:
          $ref: '#/definitions/umineko_quote_internal_dto.ParsedQuote'
        type: array
      before:
        description: Dialogue lines before the target quote
        items:
          $ref: '#/definitions/umineko_quote_internal_dto.ParsedQuote'
        type: array
      quote:
        allOf:
        - $ref: '#/definitions/umineko_quote_internal_dto.ParsedQuote'
        description: The target quote
    type: object
  dto.EpisodeCharacterLines:
    properties:
      characters:
        additionalProperties:
          type: integer
        description: Map of character ID to line count
        type: object
      episode:
        description: Episode number (1-8)
        example: 1
        type: integer
      episodeName:
        description: Episode title
        example: Legend
        type: string
    type: object
  dto.EpisodeTruth:
    properties:
      blue:
        description: Number of blue truth statements
        example: 0
        type: integer
      episode:
        description: Episode number (1-8)
        example: 2
        type: integer
      gold:
        description: Number of gold truth statements
        example: 0
        type: integer
      purple:
        description: Number of purple truth statements
        example: 0
        type: integer
      red:
        description: Number of red truth statements
        example: 38
        type: integer
    type: object
  dto.ErrorResponse:
    properties:
      error:
        description: Error message
        example: query parameter 'q' is required
        type: string
    type: object
  dto.InteractionPair:
    properties:
      charA:
        description: First character ID
        example: "10"
        type: string
      charB:
        description: Second character ID
        example: "27"
        type: string
      count:
        description: Number of adjacent dialogue exchanges
        example: 1701
        type: integer
      nameA:
        description: First character name
        example: Ushiromiya Battler
        type: string
      nameB:
        description: Second character name
        example: Beatrice
        type: string
    type: object
  dto.SearchAPIResponse:
    properties:
      limit:
        description: Maximum results per page
        example: 30
        type: integer
      offset:
        description: Pagination offset
        example: 0
        type: integer
      query:
        description: The search query that was used
        example: without love
        type: string
      results:
        description: Matching quotes with relevance scores
        items:
          $ref: '#/definitions/dto.SearchResult'
        type: array
      total:
        description: Total number of matches
        example: 25
        type: integer
    type: object
  dto.SearchResult:
    properties:
      quote:
        allOf:
        - $ref: '#/definitions/umineko_quote_internal_dto.ParsedQuote'
        description: The matched quote
      score:
        description: Relevance score (100 = exact match)
        example: 100
        type: integer
    type: object
  dto.SoundEffect:
    properties:
      afterClip:
        description: Voice clip index this SE plays after (-1 = before all clips)
        example: 0
        type: integer
      filename:
        description: Sound effect filename (without extension)
        example: umise_047
        type: string
    type: object
  dto.SpeakerStat:
    properties:
      characterId:
        description: Numeric character identifier
        example: "10"
        type: string
      count:
        description: Number of dialogue lines
        example: 4304
        type: integer
      name:
        description: Display name of the character
        example: Ushiromiya Battler
        type: string
    type: object
  dto.StatsResult:
    properties:
      characterNames:
        additionalProperties:
          type: string
        description: Map of character ID to display name
        example:
          "10": Ushiromiya Battler
          "27": Beatrice
        type: object
      characterPresence:
        description: Top characters with per-episode line counts
        items:
          $ref: '#/definitions/dto.CharacterPresence'
        type: array
      episodeNames:
        additionalProperties:
          type: string
        description: Map of episode number to title
        type: object
      interactionCounts:
        additionalProperties:
          type: integer
        description: Full interaction map keyed by "charA|charB"
        type: object
      interactions:
        description: Most frequent character dialogue pairings
        items:
          $ref: '#/definitions/dto.InteractionPair'
        type: array
      linesPerEpisode:
        description: Per-episode line breakdown by character
        items:
          $ref: '#/definitions/dto.EpisodeCharacterLines'
        type: array
      topSpeakers:
        description: Characters ranked by dialogue line count
        items:
          $ref: '#/definitions/dto.SpeakerStat'
        type: array
      truthPerEpisode:
        description: Truth counts per episode
        items:
          $ref: '#/definitions/dto.EpisodeTruth'
        type: array
    type: object
  umineko_quote_internal_dto.ParsedQuote:
    properties:
      audioCharMap:
        additionalProperties:
          type: string
        description: Maps each audio ID to its character ID
        example:
          "30101088": "10"
          "30101089": "10"
        type: object
      audioId:
        description: Comma-separated audio file IDs
        example: 30101088, 30101089
        type: string
      audioTextMap:
        additionalProperties:
          type: string
        description: Maps each audio ID to its spoken text
        example:
          "30101088": You're insane!!
          "30101089": Stop it already
        type: object
      character:
        description: Display name of the character
        example: Ushiromiya Battler
        type: string
      characterId:
        description: Numeric character identifier
        example: "10"
        type: string
      contentType:
        description: Content type marker
        example: ""
        type: string
      episode:
        description: Episode number (1-8)
        example: 3
        type: integer
      hasBlueTruth:
        description: Whether the quote contains blue truth
        example: false
        type: boolean
      hasGoldTruth:
        description: Whether the quote contains gold truth
        example: false
        type: boolean
      hasPurpleTruth:
        description: Whether the quote contains purple statements
        example: false
        type: boolean
      hasRedTruth:
        description: Whether the quote contains red truth
        example: false
        type: boolean
      soundEffects:
        description: Sound effects associated with this quote
        items:
          $ref: '#/definitions/dto.SoundEffect'
        type: array
      text:
        description: Plain text of the quote
        example: You're insane!! Stop it already, damn iiiiiiiiit!!
        type: string
      textHtml:
        description: HTML-formatted text with truth coloring
        example: You&#39;re insane!! Stop it already, damn iiiiiiiiit!!
        type: string
    type: object
info:
  contact:
    email: FAA@auaurora.moe
    name: Featherine Augustus Aurora
    url: https://x.com/FeatherineFAA
  description: API for searching and browsing Umineko no Naku Koro ni quotes
  title: Umineko Quote API
  version: "1.0"
